<header class="app-header">
  <a class="brand" routerLink="/" aria-label="Go Grind inicio">
    <span class="brand-mark">
      <img src="/assets/imgs/go-grind-logo.png" alt="" />
    </span>
    <span>
      <strong>Go Grind</strong>
      <small>fire your line</small>
    </span>
  </a>

  <nav aria-label="Principal">
    <a routerLink="/catalogo" routerLinkActive="active">Catalogo</a>
    <a routerLink="/guia" routerLinkActive="active">Guia</a>
    <a routerLink="/blade/setup" routerLinkActive="active">B.L.A.D.E.</a>
    <a routerLink="/historico" routerLinkActive="active">Historico</a>
  </nav>

  <div class="auth-actions">
    @if (auth.signedIn()) {
      <a class="user-chip" routerLink="/perfil">
        <strong>{{ auth.displayName() }}</strong>
        <span>{{ auth.profile().skateModel || 'Perfil' }}</span>
      </a>
      <button type="button" class="ghost" (click)="signOut()">Sair</button>
    } @else {
      <button type="button" class="primary" [disabled]="auth.loading()" (click)="signIn()">
        {{ auth.loading() ? 'Abrindo...' : 'Entrar' }}
      </button>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
